# Settings shared by every language. Each language's config (mkdocs.yml, mkdocs.en.yml)
# INHERITs this file and sets its own docs_dir, site_dir, site_url, language and nav.
site_name: roboloom
site_author: tetsugo
repo_name: tetsugo02/roboloom
repo_url: https://github.com/tetsugo02/roboloom
theme:
  name: material
  custom_dir: docs/overrides
  # Fonts are loaded by docs/overrides/main.html so that Japanese and serif families can be added.
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Light mode
extra:
  # Language switcher in the header (top right). Links are relative to the site root of
  # the current language, so both languages must be built side by side under site/.
  alternate:
    - name: 日本語
      link: ../ja/
      lang: ja
    - name: English
      link: ../en/
      lang: en
markdown_extensions:
  - admonition
  - attr_list  # `## Heading { #anchor }`: a stable anchor for a Japanese heading
  - md_in_html  # grid cards: <div class="grid cards" markdown>
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_section_style: table
  - redirects:
      # Old page -> new page, so published links (README, templates) keep working.
      redirect_maps:
        quick-start/installation.md: get-started/installation.md
        quick-start/rakuda2.md: tutorials/rakuda2-setup.md
        tutorials/rakuda2.md: tutorials/rakuda2-setup.md
        contribution/piper.md: robots/piper/index.md
        contribution/pika-gripper.md: robots/pika/index.md
        contribution/pika-cameras.md: sensors/pika-cameras.md
        contribution/webcam.md: sensors/webcam.md
        contribution/pika-sense.md: controllers/pose-ik.md
        contribution/rakuda2-pika.md: robots/rakuda2/pika-sense-ik.md
        contribution/pika-handheld.md: tutorials/pika-handheld.md
        reference/gravity-tuning.md: explanation/gravity-compensation.md
