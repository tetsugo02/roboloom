[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roboloom"
version = "0.1.0"
description = "Dora based Rakuda teleoperation and LeRobot recording"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dora-rs==1.0.1",
    "dora-rs-cli==1.0.1",
    "PyYAML>=6,<7",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
record = ["lerobot[dataset]==0.6.1"]
hardware = [
    "dynamixel-sdk>=3.7,<4",
    "pyrealsense2>=2.55,<3",
    "digit-interface>=0.2,<1",
    "sounddevice>=0.4,<1",
]
test = ["pytest>=8,<9", "lerobot[dataset]==0.6.1"]

[project.scripts]
roboloom = "roboloom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roboloom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "main.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyright>=1.1.414",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
