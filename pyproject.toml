[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roboloom"
version = "0.1.0"
description = "Dora based Rakuda teleoperation and LeRobot recording"
readme = "README.md"
authors = [{ name = "tetsugo", email = "tetsugou2002@gmail.com" }]
keywords = ["robotics", "teleoperation", "data-collection", "lerobot", "dora"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "dora-rs==1.0.1",
    "dora-rs-cli==1.0.1",
    "PyYAML>=6,<7",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<4.14",  # same package and range as lerobot 0.6.1, so both share one cv2
    "pyserial>=3.5,<4",  # shared by Dynamixel and Pika serial links
    "rich>=13,<15",
    "textual>=8,<9",
]

[project.urls]
Homepage = "https://github.com/tetsugo02/roboloom"
Documentation = "https://tetsugo02.github.io/roboloom/"
Repository = "https://github.com/tetsugo02/roboloom"
Issues = "https://github.com/tetsugo02/roboloom/issues"

[project.optional-dependencies]
audio = ["sounddevice>=0.4,<1", "librosa>=0.10,<1"]
rakuda2 = ["dynamixel-sdk>=3.7,<4"]  # Rakuda2 follower and Rakuda-mini leader
piper = [
    "piper_sdk>=0.6.2,<0.7",
    "pin>=4.1,<5",  # pose_ik for Pika Sense teleoperation
]
pika = [
    # PyPI has no Python 3.12 wheels/sdist. A wheel from the libsurvive fork
    # (github.com/tetsugo02/libsurvive, branch roboloom): libusb bundled, nothing built at
    # install time, the GUI (gooey/wxPython) is its optional `gui` extra. Linux x86_64 only.
    "pysurvive @ https://github.com/tetsugo02/libsurvive/releases/download/roboloom-2/pysurvive-1.1.227-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Shared features, independent of the robot.
record = ["lerobot[dataset]==0.6.1"]
hardware = [
    "pyrealsense2>=2.55,<3",
    "sounddevice>=0.4,<1",
]
digit = [
    # DIGIT tactile sensors. Upstream digit-interface 0.2.1 (archived) requires opencv-python,
    # which installs into the same cv2/ as the core opencv-python-headless. A wheel from the
    # fork (github.com/tetsugo02/digit-interface, branch roboloom) with the same code that
    # depends on opencv-python-headless instead.
    "digit-interface @ https://github.com/tetsugo02/digit-interface/releases/download/roboloom-1/digit_interface-0.2.1-py3-none-any.whl",
]
ik = ["pin>=4.1,<5"]  # inverse kinematics (controllers.pose_ik)
policy = ["lerobot==0.6.1"]  # LeRobot checkpoints (policy.lerobot); torch comes with it
train = ["lerobot[training]==0.6.1"]  # lerobot-train on roboloom datasets (accelerate, wandb)
test = [
    "pytest>=8,<9",
    "dynamixel-sdk>=3.7,<4",
    "lerobot[dataset]==0.6.1",
    "pytest-asyncio>=1,<2",
    "pin>=4.1,<5",
]

[project.scripts]
roboloom = "roboloom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roboloom"]

[tool.hatch.metadata]
allow-direct-references = true  # the pysurvive wheel URL of the pika extra

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["dynamixel_sdk", "piper_sdk", "serial", "pinocchio", "lerobot.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests", "main.py"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[dependency-groups]
docs = ["zensical>=0.0.72,<0.1"]
dev = [
    "mypy>=2.3.1",
    "pyright>=1.1.414",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
