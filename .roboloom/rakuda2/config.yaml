# Rakuda-2 (lab unit): leader teleoperation with the RealSense; the rest are launch options.
# Start:  uv run roboloom            (launcher: choose run/record/infer and the options)
#         uv run roboloom run --with head_compensation   (no launcher)
#         uv run roboloom run --mock                     (mock devices, no hardware)
# Replaces experiment.yaml / experiment_camera / _gravity / _head_compensation.
# Datasets: camera + gravity -> datasets/rakuda2, head_compensation ->
# datasets/rakuda2-head-compensation. Datasets recorded before 2026-11-03 have the old
# feature layout and cannot be appended to; move them aside before recording here.
repo_id: local/rakuda2
output: datasets/rakuda2
dataset_fps: 15
inputs:
  leader: nodes/leader.yaml
controllers:
  controller: nodes/controller.yaml
followers:
  follower: nodes/follower.yaml
sensors:
  camera: nodes/camera.yaml
recorder: nodes/recorder.yaml
session: nodes/session.yaml
options:
  gravity:
    help: gravity-compensated leader arms (identify-gravity, measure-travel, tune-gravity done)
    default: true
    set:
      inputs.leader: nodes/leader_gravity.yaml
  head_compensation:
    help: cancel the torso yaw on the head camera; neck held at its startup pose (trial)
    requires: [gravity]
    set:
      inputs.leader: nodes/leader_head_compensation.yaml
      controllers.controller: nodes/controller_head_compensation.yaml
    dataset: head-compensation
  digit:
    help: record the left/right DIGIT tactile sensors
    set:
      sensors.digit_left: nodes/digit_left.yaml
      sensors.digit_right: nodes/digit_right.yaml
    dataset: digit
