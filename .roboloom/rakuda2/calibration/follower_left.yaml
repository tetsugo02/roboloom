# Gravity identification map for the Rakuda-2 FOLLOWER left arm, for the model_residual effort
# estimator of the `bilateral` option (bilateral teleoperation, not verified on hardware).
# Motor IDs are the follower's (the same as the leader's). urdf, zero and direction are copied
#   from leader_left.yaml and NOT checked on the follower: check each joint's mapping and
#   direction; identify-gravity tries every sign combination and prints a better one.
# The output joints must be in a position mode (3 or 5) with torque off; the follower node must
#   not be running (this tool opens the follower bus itself).
# confirmed: set true only after the mapping, zeros and directions are checked.
# Usage:
#   uv run roboloom calibrate-joints .roboloom/rakuda2/calibration/follower_left.yaml
#   uv run roboloom identify-gravity .roboloom/rakuda2/calibration/follower_left.yaml \
#       --out .roboloom/rakuda2/calibration/effort_gravity_left.yaml --collect
port: SET_FOLLOWER_PORT
urdf: roboloom:robots/rakuda2/model/assembly_2.urdf
confirmed: false
# shared_parameters: false: the follower mixes XM540-W270 (shoulder) and XM430-W350 joints, whose
#   mA per N*m differ, so each output joint gets its own fit (needs more poses than the leader).
shared_parameters: false
joints:
- name: torso_yaw
  motor_id: 27
  urdf: torso_yaw_dof
  zero: 2048
  direction: 1
- name: l_arm_sh_pitch1
  motor_id: 2
  urdf: shoulder_pitch_left_dof
  zero: 2048
  direction: 1
- name: l_arm_sh_roll
  motor_id: 4
  urdf: shoulder_roll_left_dof
  zero: 2048
  direction: -1
- name: l_arm_sh_pitch2
  motor_id: 6
  urdf: elbow_yaw_left_dof
  zero: 2048
  direction: 1
- name: l_arm_el_yaw
  motor_id: 8
  urdf: elbow_pitch_left_dof
  zero: 2048
  direction: 1
- name: l_arm_wr_roll
  motor_id: 10
  urdf: wrist_yaw_left_dof
  zero: 2048
  direction: 1
- name: l_arm_wr_yaw
  motor_id: 12
  urdf: wrist_pitch_left_dof
  zero: 2048
  direction: 1
outputs:
- l_arm_sh_pitch1
- l_arm_sh_roll
- l_arm_sh_pitch2
- l_arm_el_yaw
- l_arm_wr_roll
- l_arm_wr_yaw
