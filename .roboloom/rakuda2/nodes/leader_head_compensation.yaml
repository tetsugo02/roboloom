# Trial: gravity-compensated arms, free torso, neck yaw/pitch held at startup pose.
# Align the neck before launch; support the leader before shutdown.
type: rakuda_mini
port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT7923HA-if00-port0
motor_ids:
- 27
- 28
- 29
- 1
- 3
- 5
- 7
- 9
- 11
- 31
- 2
- 4
- 6
- 8
- 10
- 12
- 30
# poll_hz: 120 Hz verified 2026-10-27 (work max 6.8 ms leader, 6.1 ms follower, of 8.3 ms).
poll_hz: 120
registers:
  drive_mode:
    default: 0
    r_arm_grip: 5
  homing_offset:
    default: 0
    r_arm_sh_pitch1: 15
    r_arm_sh_roll: -20
    r_arm_el_yaw: -512
    r_arm_wr_yaw: -512
    l_arm_sh_pitch1: -160
    l_arm_sh_roll: 20
    l_arm_el_yaw: 512
    l_arm_wr_yaw: 512
  current_limit:
    r_arm_sh_pitch1: 150
    r_arm_sh_roll: 150
    r_arm_sh_pitch2: 100
    r_arm_el_yaw: 100
    r_arm_wr_roll: 60
    r_arm_wr_yaw: 60
    l_arm_sh_pitch1: 150
    l_arm_sh_roll: 150
    l_arm_sh_pitch2: 100
    l_arm_el_yaw: 100
    l_arm_wr_roll: 60
    l_arm_wr_yaw: 60
    r_arm_grip: 30
    l_arm_grip: 30
  return_delay:
    default: 0
  shutdown:
    default: 52
control:
- group: body
  law: free
  joints:
  - torso_yaw
- group: fixed_head
  law: position
  joints:
  - head_yaw
  - head_pitch
- group: right_arm
  law: gravity_comp
  joints:
  - r_arm_sh_pitch1
  - r_arm_sh_roll
  - r_arm_sh_pitch2
  - r_arm_el_yaw
  - r_arm_wr_roll
  - r_arm_wr_yaw
  gravity_model: ../calibration/gravity_right.yaml
  tuning: ../calibration/gravity_tuning_right.yaml
  max_current_mA:
  - 150
  - 150
  - 100
  - 100
  - 60
  - 60
  kd: 0.0
  ramp_s: 2.0
  max_velocity: 3000
  range: ../calibration/travel_right.yaml
  range_margin: 100
  barrier_mA_per_count: 0.5
- group: left_arm
  law: gravity_comp
  joints:
  - l_arm_sh_pitch1
  - l_arm_sh_roll
  - l_arm_sh_pitch2
  - l_arm_el_yaw
  - l_arm_wr_roll
  - l_arm_wr_yaw
  gravity_model: ../calibration/gravity_left.yaml
  tuning: ../calibration/gravity_tuning_left.yaml
  max_current_mA:
  - 150
  - 150
  - 100
  - 100
  - 60
  - 60
  kd: 0.0
  ramp_s: 2.0
  max_velocity: 3000
  range: ../calibration/travel_left.yaml
  range_margin: 100
  barrier_mA_per_count: 0.5
- group: trigger
  law: spring
  joints:
  - r_arm_grip
  - l_arm_grip
  rest: 2500
  goal_current_mA: 30
bus_watchdog_ms: 500
