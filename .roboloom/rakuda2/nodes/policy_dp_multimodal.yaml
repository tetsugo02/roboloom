# master_proj's raw multimodal diffusion policy (camera + both DIGITs + joint state),
# dp_raw_multimodal_dynaflip_mopoe_transfer_marker_To_8_Tp_32, served from master_proj's
# own environment (torch 2.5.1; roboloom needs 2.7, so backend: process cannot load it):
# start the server there first with
#   scripts/deploy/serve_roboloom_policy.sh dp_multimodal
# which serves this file's factory and kwargs (roboloom serve-policy --from <this file>).
# Both sides need the same ROBOLOOM_POLICY_AUTHKEY. Checked with mock devices only.
type: policy
followers: [follower]
factory: scripts.deploy.roboloom_policy:load  # imported in master_proj, from its root
kwargs:
  config: inference/closed_loop_raw_multimodal_dynaflip_mopoe
  experiment: dp_raw_multimodal_dynaflip_mopoe_transfer_marker_To_8_Tp_32
  checkpoint: checkpoints/dp_raw_multimodal_dynaflip_mopoe_transfer_marker_To_8_Tp_32/2026-07-29_14-46-34/best-epoch-111.ckpt
  # the pretrained encoder file of configs/pretrained/default.yaml is gone; the policy
  # checkpoint holds the encoders' weights and is loaded strictly
  overrides: [pretrained.mopoe_rssm.checkpoint_path=null]
backend: server  # process (the default): this node loads the policy itself
server: {address: "127.0.0.1:18765", timeout_s: 30}
observe: [camera, digit_left, digit_right]
rate_hz: 5  # the policy's data was recorded at 5 Hz
action_horizon: 16  # the policy's action_horizon (configs/inference/closed_loop_raw_multimodal_dynaflip_mopoe.yaml)
observation_history: 8  # the policy's observation_horizon (To)
inference: async  # sampling takes longer than one action; the queued actions go on
# the model was trained on the 14 arm joints: torso and head keep their held target
hold: [follower.torso_yaw, follower.head_yaw, follower.head_pitch]
max_speed: {follower: 1024}  # counts/s; the template's value, not measured: lower it for the first runs
command_deadline_ms: 300
# The leader drives the follower before an episode (Teleop, key t), to bring it to the
# pose the task starts from; Start hands over to the policy. Also during an episode.
teleop: [controller.yaml]
# Home: the follower, and the leader with it, move to this pose before an episode. The
# leader holds its torso and head there (nodes/leader_fixed_camera.yaml), so the camera
# angle stays while Teleop moves the arms to where the task starts.
home:
  pose: ../poses/follower/camera_transfer_marker.yaml
  max_speed: 200
  tolerance: 30
  timeout_s: 30
