# Pika Sense (mock). On hardware: the Sense's /dev/serial/by-path/... port and the
# libsurvive name of its tracker; see docs contribution/pika-sense.md
type: pika_sense
port: /dev/serial/by-path/mock-sense-right
tracker: {name: WM1}
stale_ms: 100
poll_hz: 100  # no follower sets its rate here; the tracker reports at about 120 Hz
