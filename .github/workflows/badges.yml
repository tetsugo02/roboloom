name: Badges

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "mkdocs*.yml"
      - "scripts/docs.py"
      - "README.md"
      - "AGENTS.md"
      - "*.md"
      - ".claude/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: badges-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync CI badges from merged PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Collect test results from merged PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p "${{ runner.temp }}/badges"
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["COMMIT_SHA"]
          out_dir = Path(os.environ["RUNNER_TEMP"]) / "badges"

          def gh_json(endpoint: str):
              res = subprocess.run(
                  ["gh", "api", endpoint],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(res.stdout)

          pulls = gh_json(f"repos/{repo}/commits/{sha}/pulls")
          merged = [p for p in pulls if p.get("merged_at")]
          if not merged:
              print(f"No merged PR associated with {sha}; skipping badge sync.")
              raise SystemExit(0)

          pr = next((p for p in merged if p.get("merge_commit_sha") == sha), merged[0])
          head_sha = pr["head"]["sha"]
          print(f"Found merged PR #{pr['number']} (head_sha={head_sha})")

          run = None
          deadline = time.monotonic() + 300
          while True:
              runs = gh_json(
                  f"repos/{repo}/actions/workflows/test.yml/runs"
                  f"?head_sha={head_sha}&event=pull_request&per_page=5"
              ).get("workflow_runs", [])
              if not runs:
                  print(f"No Tests pull_request run found for {head_sha}; skipping.")
                  raise SystemExit(0)
              run = runs[0]
              if run.get("status") == "completed":
                  break
              if time.monotonic() >= deadline:
                  print(f"Timed out waiting for run {run['id']} to complete.")
                  raise SystemExit(0)
              time.sleep(10)

          conclusion = run.get("conclusion")
          if conclusion not in ("success", "failure"):
              print(f"Run {run['id']} ended with conclusion={conclusion}; skipping.")
              raise SystemExit(0)

          jobs = gh_json(f"repos/{repo}/actions/runs/{run['id']}/jobs").get("jobs", [])
          wrote_python = False
          for job in jobs:
              m = re.search(r"\(Python ([0-9]+\.[0-9]+)\)$", job.get("name", ""))
              if not m:
                  continue
              job_conclusion = job.get("conclusion")
              if job_conclusion not in ("success", "failure"):
                  continue
              wrote_python = True
              ver = m.group(1)
              ok = job_conclusion == "success"
              (out_dir / f"python-{ver}.json").write_text(
                  json.dumps(
                      {
                          "schemaVersion": 1,
                          "label": f"Python {ver}",
                          "message": "passing" if ok else "failing",
                          "color": "brightgreen" if ok else "red",
                          "namedLogo": "python",
                          "logoColor": "white",
                      },
                      indent=2,
                  )
                  + "\n",
                  encoding="utf-8",
              )

          if not wrote_python:
              print("No Python test jobs ran in the PR; skipping badge update.")
              raise SystemExit(0)

          (out_dir / "tests.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "label": "Tests",
                      "message": "passing" if conclusion == "success" else "failing",
                      "color": "brightgreen" if conclusion == "success" else "red",
                      "namedLogo": "githubactions",
                      "logoColor": "white",
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Publish badges to badges branch
        shell: bash
        run: |
          shopt -s nullglob
          files=("${{ runner.temp }}/badges"/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No badge payloads to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin badges:badges 2>/dev/null; then
            git switch badges
          else
            git switch --orphan badges
          fi
          cp "${files[@]}" .
          git add *.json
          if git diff --cached --quiet; then
            echo "Badge JSONs are unchanged."
            exit 0
          fi
          git commit -m "chore(ci): update CI status badges"
          git push origin HEAD:badges
