name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Check changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - name: Detect whether tests should run
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import fnmatch
          import os
          import subprocess
          from pathlib import Path

          out_path = Path(os.environ["GITHUB_OUTPUT"])

          def write_output(run_tests: bool) -> None:
              val = "true" if run_tests else "false"
              with out_path.open("a", encoding="utf-8") as f:
                  f.write(f"run_tests={val}\n")
              print(f"run_tests={val}")

          if os.environ["EVENT_NAME"] != "pull_request":
              write_output(True)
              raise SystemExit(0)

          repo = os.environ["GITHUB_REPOSITORY"]
          pr = os.environ["PR_NUMBER"]
          res = subprocess.run(
              [
                  "gh",
                  "api",
                  f"repos/{repo}/pulls/{pr}/files?per_page=100",
                  "--paginate",
                  "--jq",
                  ".[].filename",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          files = [line.strip() for line in res.stdout.splitlines() if line.strip()]
          if not files or len(files) >= 3000:
              write_output(True)
              raise SystemExit(0)

          def is_ignored(path: str) -> bool:
              if path.startswith(("docs/", ".claude/")):
                  return True
              if path in ("scripts/docs.py", ".github/workflows/docs.yml"):
                  return True
              if "/" not in path and (
                  path.endswith(".md") or fnmatch.fnmatchcase(path, "mkdocs*.yml")
              ):
                  return True
              return False

          need = [p for p in files if not is_ignored(p)]
          print("Non-ignored files:", need)
          write_output(bool(need))
          PY

  unit:
    name: ruff, mypy and unit tests (Python ${{ matrix.python }})
    needs: [changes]
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.8.15"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install the locked test and development dependencies
        run: uv sync --locked --extra rakuda2 --extra test --group dev
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Type-check
        run: uv run --no-sync mypy src
      - name: Unit tests
        run: uv run --no-sync pytest -q -m "not e2e"
      - name: Write Python badge JSON
        if: >-
          always() &&
          github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch' &&
          (job.status == 'success' || job.status == 'failure')
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "${{ runner.temp }}/badge-out"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          ver = os.environ["PYTHON_VERSION"]
          ok = os.environ["JOB_STATUS"] == "success"
          payload = {
              "schemaVersion": 1,
              "label": f"Python {ver}",
              "message": "passing" if ok else "failing",
              "color": "brightgreen" if ok else "red",
              "namedLogo": "python",
              "logoColor": "white",
          }
          out = Path(os.environ["RUNNER_TEMP"]) / "badge-out" / f"python-{ver}.json"
          out.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload Python badge JSON
        if: >-
          always() &&
          github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch' &&
          (job.status == 'success' || job.status == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: badge-python-${{ matrix.python }}
          path: ${{ runner.temp }}/badge-out/python-${{ matrix.python }}.json
          retention-days: 1

  status:
    name: Tests status
    needs: [changes, unit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify test status
        shell: bash
        env:
          RUN_TESTS: ${{ needs.changes.outputs.run_tests }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection did not succeed ($CHANGES_RESULT)."
            exit 1
          fi
          if [ "$RUN_TESTS" = "false" ]; then
            echo "Only ignored documentation/markdown files changed; tests skipped."
            exit 0
          fi
          if [ "$UNIT_RESULT" != "success" ]; then
            echo "Unit tests did not succeed ($UNIT_RESULT)."
            exit 1
          fi
          echo "All Python matrix tests succeeded."

  badges:
    name: Update CI status badges
    needs: [changes, unit]
    if: >-
      always() &&
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download Python badge JSONs
        uses: actions/download-artifact@v8
        with:
          pattern: badge-python-*
          path: ${{ runner.temp }}/badges
          merge-multiple: true
      - name: Write overall Tests badge JSON
        if: needs.unit.result == 'success' || needs.unit.result == 'failure'
        shell: bash
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          mkdir -p "${{ runner.temp }}/badges"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          ok = os.environ["UNIT_RESULT"] == "success"
          payload = {
              "schemaVersion": 1,
              "label": "Tests",
              "message": "passing" if ok else "failing",
              "color": "brightgreen" if ok else "red",
              "namedLogo": "githubactions",
              "logoColor": "white",
          }
          out = Path(os.environ["RUNNER_TEMP"]) / "badges" / "tests.json"
          out.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Publish badges to badges branch
        shell: bash
        run: |
          shopt -s nullglob
          files=("${{ runner.temp }}/badges"/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No badge payloads to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin badges:badges 2>/dev/null; then
            git switch badges
          else
            git switch --orphan badges
          fi
          cp "${files[@]}" .
          git add *.json
          if git diff --cached --quiet; then
            echo "Badge JSONs are unchanged."
            exit 0
          fi
          git commit -m "chore(ci): update CI status badges"
          git push origin HEAD:badges
