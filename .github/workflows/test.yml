name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "mkdocs*.yml"
      - "scripts/docs.py"
      - "README.md"
      - "AGENTS.md"
      - "*.md"
      - ".claude/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "mkdocs*.yml"
      - "scripts/docs.py"
      - "README.md"
      - "AGENTS.md"
      - "*.md"
      - ".claude/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: ruff, mypy and unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.8.15"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install the locked test and development dependencies
        run: uv sync --locked --extra rakuda2 --extra test --group dev
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Type-check
        run: uv run --no-sync mypy src
      - name: Unit tests
        run: uv run --no-sync pytest -q -m "not e2e"
