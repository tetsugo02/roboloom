# Japanese documentation. English: mkdocs.en.yml. Build both: uv run --group docs python scripts/docs.py build
INHERIT: docs/base.yml
site_description: Rakuda2 の teleoperation とデータ収集
docs_dir: docs/ja
site_dir: site/ja
# Canonical public URL; the serve commands also support local previews.
site_url: https://tetsugo02.github.io/roboloom/ja/
theme:
  language: ja
nav:
  - ホーム: index.md
  - Get started:
      - インストール: get-started/installation.md
  - Tutorials:
      - Rakuda2：設定から収集まで: tutorials/rakuda2.md
      - Pika Senseを手に持った収集（開発中）: tutorials/pika-handheld.md
  - Robots:
      - 概要: robots/index.md
      - Rakuda2:
          - 概要: robots/rakuda2/index.md
          - Pika SenseとIKで動かす（開発中）: robots/rakuda2/pika-sense-ik.md
      - PiPER（開発中）: robots/piper/index.md
      - Pika Gripper（開発中）: robots/pika/index.md
  - Controllers:
      - 概要: controllers/index.md
      - Leader: controllers/leader.md
      - Pika SenseとIK（開発中）: controllers/pose-ik.md
  - Sensors:
      - 概要: sensors/index.md
      - RealSense: sensors/realsense.md
      - DIGIT: sensors/digit.md
      - Audio: sensors/audio.md
      - Pikaの手首カメラ（開発中）: sensors/pika-cameras.md
      - Webカメラ（開発中）: sensors/webcam.md
  - Policy:
      - 概要: policy/index.md
      - 方策で動かす: policy/run.md
      - LeRobotの方策: policy/lerobot.md
      - 自作の方策: policy/custom.md
      - 別のプロセスで動かす: policy/remote.md
      - 非同期の推論と補間: policy/async.md
      - テレオペと介入: policy/intervention.md
      - 評価と再生: policy/evaluation.md
  - Data:
      - データの形式: data/format.md
      - 記録と保存: data/recording.md
      - 検査と学習: data/check-and-train.md
  - Reference:
      - 設定:
          - 概要: reference/configuration/index.md
          - Followers: reference/configuration/followers.md
          - Inputs: reference/configuration/inputs.md
          - Controllers: reference/configuration/controllers.md
          - Policy: reference/configuration/policy.md
          - Sensors: reference/configuration/sensors.md
          - Recorder と session: reference/configuration/recorder.md
          - 制御則と制限: reference/configuration/control.md
      - CLI: reference/cli.md
      - Python API:
          - 概要: reference/python-api/index.md
          - Session: reference/python-api/session.md
          - Setup: reference/python-api/setup.md
          - Policy: reference/python-api/policy.md
          - Recording: reference/python-api/recording.md
      - データセットの列: reference/dataset-features.md
      - 操作画面: reference/operator-screen.md
      - 状態ラベル: reference/status-labels.md
  - Explanation:
      - 重力補償の調整: explanation/gravity-compensation.md
  - Contribution:
      - 開発: contribution/index.md
      - バイラテラル制御の設計: contribution/bilateral.md
exclude_docs: |
  yam-safety-and-smoothness.md
