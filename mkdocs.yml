# Japanese documentation. English: mkdocs.en.yml. Build both: uv run --group docs python scripts/docs.py build
INHERIT: docs/base.yml
site_description: Rakuda2 の teleoperation とデータ収集
docs_dir: docs/ja
site_dir: site/ja
# Canonical public URL; the serve commands also support local previews.
site_url: https://tetsugo02.github.io/roboloom/ja/
theme:
  language: ja
nav:
  - ホーム: index.md
  - Quick start:
      - インストール: quick-start/installation.md
      - Rakuda2: quick-start/rakuda2.md
  - Robots:
      - 概要: robots/index.md
      - Rakuda2: robots/rakuda2.md
  - Sensors:
      - 概要: sensors/index.md
      - RealSense: sensors/realsense.md
      - DIGIT: sensors/digit.md
  - Controllers:
      - 概要: controllers/index.md
      - Leader: controllers/leader.md
      - 方策: controllers/policy.md
  - Reference:
      - 設定: reference/configuration.md
      - CLI: reference/cli.md
      - 操作画面: reference/operator-screen.md
      - Python API: reference/python-api.md
      - 重力補償の調整: reference/gravity-tuning.md
  - Contribution:
      - 開発: contribution.md
      - バイラテラル制御の設計: contribution/bilateral.md
      - PiPERフォロワ（開発中）: contribution/piper.md
      - Pika Gripperフォロワ（開発中）: contribution/pika-gripper.md
      - Pika SenseとIKによる遠隔操作（開発中）: contribution/pika-sense.md
      - Pikaの手首カメラ（開発中）: contribution/pika-cameras.md
exclude_docs: |
  yam-safety-and-smoothness.md
