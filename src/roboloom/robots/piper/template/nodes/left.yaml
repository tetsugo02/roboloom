# The left PiPER. `roboloom setup` writes can: the serial number of its USB-CAN
# adapter (interface names such as can0 swap after a reconnect; the serial does not).
# The limits are inside the vendor's range, not a collision check: narrow them for the
# table and the other arm. At power-off the arm folds to about all zeros, slightly outside
# joint2 >= 0 and joint3 <= 0; Move home brings it inside.
type: piper_follower
can: {serial: SET_LEFT_CAN_SERIAL}
control_hz: 100
speed_percent: 20  # the firmware's joint speed scale; raise once teleoperation works
health:
  every_ticks: 10
  max_temperature_c: 60
limits:  # rad
  - {name: joint1, min: -2.6, max: 2.6, max_speed: 0.8, max_jump: 0.3}
  - {name: joint2, min: 0.0, max: 3.1, max_speed: 0.8, max_jump: 0.3}
  - {name: joint3, min: -2.9, max: 0.0, max_speed: 0.8, max_jump: 0.3}
  - {name: joint4, min: -1.7, max: 1.7, max_speed: 0.8, max_jump: 0.3}
  - {name: joint5, min: -1.2, max: 1.2, max_speed: 0.8, max_jump: 0.3}
  - {name: joint6, min: -2.0, max: 2.0, max_speed: 0.8, max_jump: 0.3}
