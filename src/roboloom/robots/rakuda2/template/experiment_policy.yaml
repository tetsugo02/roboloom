# Rakuda-2 inference: a learned policy drives the follower; RealSense and DIGIT are
# observed and recorded (an evaluation dataset, kept apart from teleoperation data).
# Run:  uv run roboloom infer rakuda2/experiment_policy --policy my_lab.policies:load --hardware
# The template's policy (roboloom.policy:hold) keeps the arm where it is: use it first
# to check the inference path on the real robot.
robot_id: rakuda2
repo_id: local/rakuda2_eval
output: datasets/rakuda2_eval
mode: hardware
dataset_fps: 15
inputs: {}
controllers:
  policy: nodes/policy.yaml
robots:
  robot: nodes/robot.yaml
sensors:
  camera: nodes/camera.yaml
  digit_left: nodes/digit_left.yaml
  digit_right: nodes/digit_right.yaml
recorder: nodes/recorder.yaml
session: nodes/session.yaml
