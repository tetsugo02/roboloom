# Gravity identification map for the Rakuda-2 leader right arm.
# urdf: proposed from the URDF chain order (shoulder -> wrist). It is NOT verified that
#   motor r_arm_sh_pitch1 moves URDF joint shoulder_pitch_right_dof, and so on: check each one.
# zero: raw count at URDF angle 0. 2048 (motor centre) is a first guess; the fit report shows
#   whether it is good enough (offsets that only rotate the links below are absorbed by the fit).
# direction: signs found on the lab unit (mirrored between the arms: sh_roll -1 on both, sh_pitch1
#   and el_yaw -1 on the right only). identify-gravity tries every sign combination and refuses
#   to save when another combination fits much better, printing it; copy those signs here.
# confirmed: set true only after the mapping, zeros and directions are checked.
# Usage:
#   uv run roboloom calibrate-joints .roboloom/rakuda2/calibration/leader_right.yaml
#   uv run roboloom identify-gravity .roboloom/rakuda2/calibration/leader_right.yaml \
#       --out .roboloom/rakuda2/calibration/gravity_right.yaml --collect --hardware
port: SET_LEADER_PORT
urdf: roboloom:robots/rakuda2/model/assembly_2.urdf
confirmed: false
# shared_parameters: the output joints are all XC330-T288, so one set of link moments is fit for
#   all of them (mA per N*m in common). Needs far fewer poses than independent per-joint fits.
shared_parameters: true
joints:
- name: torso_yaw
  motor_id: 27
  urdf: torso_yaw_dof
  zero: 2048
  direction: 1
- name: r_arm_sh_pitch1
  motor_id: 1
  urdf: shoulder_pitch_right_dof
  zero: 2048
  direction: -1
- name: r_arm_sh_roll
  motor_id: 3
  urdf: shoulder_roll_right_dof
  zero: 2048
  direction: -1
- name: r_arm_sh_pitch2
  motor_id: 5
  urdf: elbow_yaw_right_dof
  zero: 2048
  direction: 1
- name: r_arm_el_yaw
  motor_id: 7
  urdf: elbow_pitch_right_dof
  zero: 2048
  direction: -1
- name: r_arm_wr_roll
  motor_id: 9
  urdf: wrist_yaw_right_dof
  zero: 2048
  direction: 1
- name: r_arm_wr_yaw
  motor_id: 11
  urdf: wrist_pitch_right_dof
  zero: 2048
  direction: 1
outputs:
- r_arm_sh_pitch1
- r_arm_sh_roll
- r_arm_sh_pitch2
- r_arm_el_yaw
- r_arm_wr_roll
- r_arm_wr_yaw
