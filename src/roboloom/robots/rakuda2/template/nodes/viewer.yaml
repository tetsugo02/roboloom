# The live view of the observations in Rerun (option viewer; needs the viz extra).
rate_hz: 10  # how often the view refreshes (whole Hz or whole milliseconds per tick)
compress_images: true  # JPEG-compress images before logging (less bandwidth and memory)
ip: null  # connect to a Rerun server at this address (with port); null: spawn a viewer
port: null  # the server's port (with ip); null: spawn a viewer
save: null  # save the view to this .rrd file instead of opening a viewer (with ip/port: both)
memory_limit: "10%"  # the spawned viewer's memory budget before it drops old data