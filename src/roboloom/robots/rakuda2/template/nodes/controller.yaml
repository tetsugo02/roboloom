# Identity mapping in raw counts, as robopy used. alignment_tolerance: max leader-follower
# difference (counts) before the follower starts following and before every episode start.
type: joint
input: leader
robot: robot
unit: dynamixel_count
alignment_tolerance: 300
max_speed_counts_per_s: 2048
command_deadline_ms: 100
input_timeout_ms: 150
# Optional measured-motion compensation, applied after mapping and before speed limits.
# For head-camera yaw compensation (verify motor directions on your robot):
# couplings:
# - {joint: head_yaw, source: torso_yaw, scale: -1.0, reference: 2048, lead_ms: 70}
# reference: follower torso count at which the mapped head target is used unchanged
# (torso facing forward). lead_ms: look ahead along the torso velocity for the head's
# position-loop lag (optional, default 0). The head leader can be locked separately.
couplings: []
# Optional saved initial pose: the `home` command moves leader and follower there slowly,
# and the leader returns to its normal laws one second after arriving. Save poses with `roboloom capture-pose <exp> <name>`
# (several names can coexist under ../poses/); choose one here. max_speed: counts/s.
# A gravity leader needs `homing:` on its arm groups (leader_gravity.yaml).
# home:
#   pose: ../poses/ready.yaml
#   max_speed: 200
#   tolerance: 30
#   timeout_s: 30
joints:
- leader: torso_yaw
  follower: torso_yaw
  sign: 1
  offset: 0
- leader: head_yaw
  follower: head_yaw
  sign: 1
  offset: 0
- leader: head_pitch
  follower: head_pitch
  sign: 1
  offset: 0
- leader: r_arm_sh_pitch1
  follower: r_arm_sh_pitch1
  sign: 1
  offset: 0
- leader: r_arm_sh_roll
  follower: r_arm_sh_roll
  sign: 1
  offset: 0
- leader: r_arm_sh_pitch2
  follower: r_arm_sh_pitch2
  sign: 1
  offset: 0
- leader: r_arm_el_yaw
  follower: r_arm_el_yaw
  sign: 1
  offset: 0
- leader: r_arm_wr_roll
  follower: r_arm_wr_roll
  sign: 1
  offset: 0
- leader: r_arm_wr_yaw
  follower: r_arm_wr_yaw
  sign: 1
  offset: 0
- leader: r_arm_grip
  follower: r_arm_grip
  sign: 1
  offset: 0
- leader: l_arm_sh_pitch1
  follower: l_arm_sh_pitch1
  sign: 1
  offset: 0
- leader: l_arm_sh_roll
  follower: l_arm_sh_roll
  sign: 1
  offset: 0
- leader: l_arm_sh_pitch2
  follower: l_arm_sh_pitch2
  sign: 1
  offset: 0
- leader: l_arm_el_yaw
  follower: l_arm_el_yaw
  sign: 1
  offset: 0
- leader: l_arm_wr_roll
  follower: l_arm_wr_roll
  sign: 1
  offset: 0
- leader: l_arm_wr_yaw
  follower: l_arm_wr_yaw
  sign: 1
  offset: 0
- leader: l_arm_grip
  follower: l_arm_grip
  sign: 1
  offset: 0
