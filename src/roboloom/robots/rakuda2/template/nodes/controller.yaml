# The leader has the follower's joints and unit, so every follower joint follows the
# leader joint of the same name (raw counts, as robopy used). alignment_tolerance: max leader-follower
# difference (counts) before the follower starts following and before every episode start.
type: joint
input: leader
followers: [follower]
alignment_tolerance: 300
max_speed: 2048
command_deadline_ms: 100
input_timeout_ms: 150
# Optional measured-motion compensation, applied after mapping and before speed limits.
# For head-camera yaw compensation (verify motor directions on your robot):
# couplings:
# - {joint: head_yaw, source: torso_yaw, scale: -1.0, reference: 2048, lead_ms: 70}
# reference: follower torso count at which the mapped head target is used unchanged
# (torso facing forward). lead_ms: look ahead along the torso velocity for the head's
# position-loop lag (optional, default 0). The head leader can be locked separately.
couplings: []
# Optional saved initial pose: the `home` command moves leader and follower there slowly,
# and the leader returns to its normal laws one second after arriving. Save poses with `roboloom capture-pose <name>`
# (several names can coexist under ../poses/follower/); choose one here. max_speed: counts/s.
# A gravity leader needs `homing:` on its arm groups (leader_gravity.yaml).
# home:
#   pose: ../poses/follower/ready.yaml
#   max_speed: 200
#   tolerance: 30
#   timeout_s: 30
# Other names, directions or offsets: one entry per follower joint, in its order.
# joints:
# - {leader: torso_yaw, follower: torso_yaw, sign: 1, offset: 0}
# - ...
