# Fill from `roboloom probe <port>` (see ../README.md). Re-run probe after any motor change.
# registers: EEPROM values the node verifies at startup and refuses to run on mismatch.
# Fill them from `roboloom probe`; current_limit in mA, return_delay in microseconds.
# limits: min/max are only the EEPROM bounds for now (no extra protection); narrow them to the
#   measured safe travel of each joint before unattended use.
# limits: software range in counts (inside the EEPROM limits), max_speed counts/s (soft clamp;
#   keep it above the controller's max_speed_counts_per_s so it only catches real overspeed),
# max_jump counts (hard reject). Measure the range on this robot; do not copy the mock values.
# health.max_current_mA: FAULT before the motor's own overload shutdown; validate on hardware.
# torque: set false for the first run to record states and sensors without moving the follower.
# bus_watchdog_ms: leave null until the watchdog behaviour is bench-tested on these motors.
type: rakuda2_follower
port: SET_FOLLOWER_PORT  # /dev/serial/by-id/... of the follower U2D2
motor_ids:
- 27
- 28
- 29
- 1
- 3
- 5
- 7
- 9
- 11
- 31
- 2
- 4
- 6
- 8
- 10
- 12
- 30
control_hz: 60
torque: true
record_effort: true
bus_watchdog_ms: null
registers:
  operating_mode:
    default: 3
    r_arm_grip: 5
    l_arm_grip: 5
  drive_mode:
    default: 0
    r_arm_grip: 5
    l_arm_grip: 5
  homing_offset:
    default: 0  # add per-joint offsets from `roboloom probe`
  current_limit:
    r_arm_grip: 54
    l_arm_grip: 54
  return_delay:
    default: 0
  shutdown:
    default: 52
health:
  every_ticks: 10
  max_temperature_c: 70
  over_current_s: 2.0
  max_current_mA:
  - 3500
  - 2000
  - 2000
  - 3500
  - 3500
  - 2000
  - 2000
  - 2000
  - 2000
  - 400
  - 3500
  - 3500
  - 2000
  - 2000
  - 2000
  - 2000
  - 400
limits:
- name: torso_yaw
  min: 0
  max: 4095
  max_speed: 3072
  max_jump: 300
- name: head_yaw
  min: 0
  max: 4095
  max_speed: 3072
  max_jump: 300
- name: head_pitch
  min: 0
  max: 4095
  max_speed: 3072
  max_jump: 300
- name: r_arm_sh_pitch1
  min: 0
  max: 4095
  max_speed: 3072
  max_jump: 300
- name: r_arm_sh_roll
  min: 0
  max: 4095
  max_speed: 3072
  max_jump: 300
- name: r_arm_sh_pitch2
  min: 0
  max: 4095
  max_speed: 3072
  max_jump: 300
- name: r_arm_el_yaw
  min: 0
  max: 4095
  max_speed: 3072
  max_jump: 300
- name: r_arm_wr_roll
  min: 0
  max: 4095
  max_speed: 3072
  max_jump: 300
- name: r_arm_wr_yaw
  min: 0
  max: 4095
  max_speed: 3072
  max_jump: 300
- name: r_arm_grip
  min: 0
  max: 2600
  max_speed: 3072
