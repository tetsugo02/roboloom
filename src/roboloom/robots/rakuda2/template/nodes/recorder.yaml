max_age_ms:
  audio: 1500
  leader: 200
  follower: 200
  camera: 200
  digit_left: 200
  digit_right: 200
  effort: 200  # option bilateral: estimator with record: true
grace_ms: 500
image_writer_threads: 4
streaming_encoding: false
# Codec of storage: video images: h264 (plays almost everywhere) or av1 (smaller,
# LeRobot's own default). Unset: H.264, or the saved videos' codec when appending.
# video_codec: av1
queue_s: 0.5
