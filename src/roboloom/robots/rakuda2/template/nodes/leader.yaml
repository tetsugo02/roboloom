# Fill from `roboloom probe <port>` (see ../README.md). Re-run probe after any motor change.
# registers: EEPROM values the node verifies at startup and refuses to run on mismatch.
# Fill them from `roboloom probe`; current_limit in mA, return_delay in microseconds.
# drive_mode: r_arm_grip is reversed (5) and l_arm_grip is not (0) ON PURPOSE, so the two triggers
#   move symmetrically for the operator. Do not "fix" it; the follower grippers are set separately.
# control: the arm joints stay limp (moved by hand); the gripper triggers are a return spring:
#   held at rest (robopy GRIP_OPEN_POSITION = 2500) in current-based position mode, pushed back
#   with at most goal_current_mA (<= the motors' EEPROM Current Limit). 30 mA follows robopy
#   (LEADER_GRIP_CURRENT_LIMIT / LEADER_GRIP_GOAL_CURRENT); 20 mA was lost in gear friction.
type: rakuda2_leader
port: SET_LEADER_PORT  # /dev/serial/by-id/... of the leader U2D2
motor_ids:
- 27
- 28
- 29
- 1
- 3
- 5
- 7
- 9
- 11
- 31
- 2
- 4
- 6
- 8
- 10
- 12
- 30
poll_hz: 60
registers:
  operating_mode:
    default: 3
    r_arm_grip: 5
    l_arm_grip: 5
  drive_mode:
    default: 0
    r_arm_grip: 5
  homing_offset:
    default: 0  # add per-joint offsets from `roboloom probe`
  current_limit:
    r_arm_grip: 30
    l_arm_grip: 30
  return_delay:
    default: 0
  shutdown:
    default: 52
control:
- group: hand
  law: free
  joints:
  - torso_yaw
  - head_yaw
  - head_pitch
  - r_arm_sh_pitch1
  - r_arm_sh_roll
  - r_arm_sh_pitch2
  - r_arm_el_yaw
  - r_arm_wr_roll
  - r_arm_wr_yaw
  - l_arm_sh_pitch1
  - l_arm_sh_roll
  - l_arm_sh_pitch2
  - l_arm_el_yaw
  - l_arm_wr_roll
  - l_arm_wr_yaw
- group: trigger
  law: spring
  joints:
  - r_arm_grip
  - l_arm_grip
  rest: 2500
  goal_current_mA: 30
