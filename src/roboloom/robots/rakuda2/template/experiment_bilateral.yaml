# Bilateral teleoperation (force feedback from the follower to the leader). NOT verified on
# hardware; see the README, section "Bilateral teleoperation (not verified)".
# Run: uv run roboloom run rakuda2/experiment_bilateral --hardware
robot_id: rakuda2
repo_id: local/rakuda2-bilateral
output: datasets/rakuda2-bilateral
mode: hardware
dataset_fps: 15
inputs:
  leader: nodes/leader_bilateral.yaml
controllers:
  controller: nodes/controller_bilateral.yaml
robots:
  robot: nodes/robot_bilateral.yaml
estimators:
  effort: nodes/effort.yaml
recorder: nodes/recorder.yaml
session: nodes/session.yaml
